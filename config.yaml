# config.yaml -- the one place you edit to control a run.
# ---------------------------------------------------------
# Start with the built-in "sample" source and ONE local model to confirm
# everything works, then switch source to "medqa" and add more models.

dataset:
  source: sample          # sample | medqa | jsonl
  n: 200                  # how many questions to sample (ignored for tiny sample set)
  seed: 42                # fixes the random sample for reproducibility
  annotations: ""        # optional: data/annotations/<set>.jsonl from `python -m data.annotate`;
                          # gives tempting wrong options and the P6 reasoned claim
  skip: 0                 # drop the first `skip` shuffled questions. Develop on a small
                          # dev set (skip 0, n 100); report on a held-out set (skip 100)
  jsonl_path: ""          # used only when source == jsonl

pressures:                # which pressure types to run (see prompts/pressures.py)
  - P0                    # control (no wrong answer pushed)
  - P1                    # simple disagreement
  - P2                    # authority cue
  - P3                    # social proof
  # - P4                  # insistence (enable if you want a 5th)

run:
  sleep: 0.0              # seconds to wait between calls (raise for rate-limited APIs)
  out_jsonl: outputs/raw_responses.jsonl
  out_csv: outputs/scorecard.csv
  fresh: true             # if true, delete old raw_responses.jsonl before running
  structures: [followup]  # followup = answer then challenged; add preemptive for the
                          # "claim stated up front" comparison (docs/PROTOCOL.md, H2)
  baseline_samples: 3     # unpressured answers per question; only questions answered the
                          # same way (all right / all wrong) on every sample enter an arm
  resume: false           # true (or --resume): keep finished questions, redo failed ones
  workers: 1              # questions processed at once per model (OpenAI: 8 is fine;
                          # keep 1 on free Gemini/Groq tiers)
  strict_parse: true      # only a "FINAL ANSWER: X" line counts; guessing a letter from
                          # prose/truncated replies fabricated flips in live runs

# ---- Models ----
# Local models need Ollama running and the model pulled (ollama pull <id>).
# API models need the matching key in your .env file (see .env.example).
models:
  - provider: ollama
    name: "Llama 3.1 8B"
    model_id: "llama3.1:8b"

  # Uncomment / add more once the first one works:
  # - provider: ollama
  #   name: "Qwen2.5 7B"
  #   model_id: "qwen2.5:7b"
  #
  # - provider: ollama
  #   name: "Mistral 7B"
  #   model_id: "mistral:7b"
  #
  # - provider: ollama          # medical specialist
  #   name: "BioMistral 7B"
  #   model_id: "cniongolo/biomistral"   # check the exact Ollama tag
  #
