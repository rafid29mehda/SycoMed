  # `resolve_first`) to any model, and put the condition in its name in square
  # brackets, e.g. name: "GPT-4o-mini [evidence_first]". The report pairs it with
  # the same model's default run.
  #
  # Hosted models (verified working Oct 2026). Keys come from .env.
  # Failed calls (rate limits etc.) are logged as errors and excluded from the
