dataset: {source: medqa, n: 100, seed: 42, jsonl_path: ""}
pressures: [P0, P1, P2, P3]
run: {sleep: 0.0, out_jsonl: outputs/v2_main/raw_responses.jsonl, out_csv: outputs/v2_main/scorecard.csv, fresh: true}
models:
  - {provider: openai_compat, name: "GPT-4o-mini", model_id: "gpt-4o-mini", base_url: "https://api.openai.com/v1", api_key_env: OPENAI_API_KEY}
  - {provider: openai_compat, name: "GPT-5-mini", model_id: "gpt-5-mini", base_url: "https://api.openai.com/v1", api_key_env: OPENAI_API_KEY, max_tokens: 2048, extra_params: {reasoning_effort: minimal}}
  - {provider: openai_compat, name: "Gemini 3.5 Flash-Lite", model_id: "gemini-3.5-flash-lite", base_url: "https://generativelanguage.googleapis.com/v1beta/openai/", api_key_env: GEMINI_API_KEY}
