# Development set: used to finish and debug the tool with ONE cheap model.
# The held-out evaluation set starts at skip: 600 (Studies 1-3 used the first 600).
dataset:
  source: medqa
  n: 100
  seed: 42
  skip: 0
  annotations: data/annotations/dev.jsonl
pressures: [P0, P1, P2, P3, P5, P6]
run:
  sleep: 0.0
  workers: 8
  structures: [followup, preemptive]
  baseline_samples: 3
  out_jsonl: outputs/dev/raw_responses.jsonl
  out_csv: outputs/dev/scorecard.csv
  fresh: true
annotate:                # the independent generator of tempting options and rationales
  provider: openai_compat
  name: "annotator (gpt-5-mini)"
  model_id: gpt-5-mini
  base_url: "https://api.openai.com/v1"
  api_key_env: OPENAI_API_KEY
  max_tokens: 4096
  workers: 8
models:
  - {provider: openai_compat, name: "GPT-4.1-nano", model_id: "gpt-4.1-nano", base_url: "https://api.openai.com/v1", api_key_env: OPENAI_API_KEY}
