dataset: {source: medqa, n: 40, seed: 42, jsonl_path: ""}
pressures: [P0, P1, P2, P3, P5]
run:
  sleep: 0.0
  workers: 8
  structures: [followup]
  baseline_samples: 3
  out_jsonl: outputs/final_check/raw_responses.jsonl
  out_csv: outputs/final_check/scorecard.csv
  fresh: true
models:
  - {provider: openai_compat, name: "GPT-4.1-nano", model_id: "gpt-4.1-nano", base_url: "https://api.openai.com/v1", api_key_env: OPENAI_API_KEY}
  - {provider: openai_compat, name: "GPT-4o-mini", model_id: "gpt-4o-mini", base_url: "https://api.openai.com/v1", api_key_env: OPENAI_API_KEY}
